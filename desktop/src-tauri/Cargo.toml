[package]
name = "powerdb-desktop"
version = "0.4.0"
description = "PowerDB desktop: install, run and manage a local PowerDB server"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "powerdb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# a standalone workspace: the desktop app has its own dependency tree and lock file
[workspace]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
