name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable, components: clippy, rustfmt }
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
  sdk-and-dashboard:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: cargo build --locked --release
      - run: npm ci && npm test
        working-directory: sdk
      - run: npm ci && npm run typecheck
        working-directory: dashboard
      - name: Dashboard tests (against the real server)
        run: npm test
        working-directory: dashboard
  docker:
    # Builds the image and runs it, on both architectures: the image is only worth shipping if a container actually starts.
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, ubuntu-24.04-arm] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -t powerdb:ci .
      - name: Start it, wait for health, write and read data
        run: |
          docker run -d --name pdb -p 127.0.0.1:8090:8090 -v pdbdata:/data powerdb:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pdb)" = healthy ] && break
            sleep 2
          done
          docker inspect -f 'health: {{.State.Health.Status}}' pdb
          [ "$(docker inspect -f '{{.State.Health.Status}}' pdb)" = healthy ] || { docker logs pdb; exit 1; }
          curl -fsS http://127.0.0.1:8090/api/v1/healthz; echo
          KEY=$(docker logs pdb 2>&1 | grep -o 'pdb_live_[A-Za-z0-9_-]*' | head -1)
          [ -n "$KEY" ] || { docker logs pdb; exit 1; }
          curl -fsS -X POST -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            http://127.0.0.1:8090/api/v1/collections \
            -d '{"name":"t","rules":{},"fields":[{"name":"x","kind":"text"}]}' >/dev/null
          curl -fsS -X POST -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            http://127.0.0.1:8090/api/v1/maintenance/backups -d '{"name":"ci"}'; echo
          echo "-- restart: the data and the lock must survive a clean stop (SIGTERM)"
          docker stop -t 30 pdb
          docker start pdb
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pdb)" = healthy ] && break
            sleep 2
          done
          curl -fsS -H "authorization: Bearer $KEY" http://127.0.0.1:8090/api/v1/collections | grep -q '"name":"t"'
          docker exec pdb powerdb --version
      - name: Bind-mounted data folders (root-owned, and a specific non-root user)
        run: |
          set -eu
          wait_healthy() {
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          # 1. a folder owned by root: the entrypoint hands it to the unprivileged user
          sudo mkdir -p "$RUNNER_TEMP/bind-root" && sudo chown root:root "$RUNNER_TEMP/bind-root"
          docker run -d --name bind-root -v "$RUNNER_TEMP/bind-root:/data" powerdb:ci
          wait_healthy bind-root
          [ "$(stat -c %u "$RUNNER_TEMP/bind-root/FORMAT")" = 10001 ] || { echo "data not owned by the powerdb user"; ls -ln "$RUNNER_TEMP/bind-root"; exit 1; }
          docker stop -t 30 bind-root
          # 2. started as a specific user, with a folder that user owns (the way many deployments run)
          mkdir -p "$RUNNER_TEMP/bind-user"
          docker run -d --name bind-user --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/bind-user:/data" powerdb:ci
          wait_healthy bind-user
          [ "$(stat -c %u "$RUNNER_TEMP/bind-user/FORMAT")" = "$(id -u)" ] || { echo "data not owned by the requested user"; exit 1; }
          docker stop -t 30 bind-user
  service:
    # Installs PowerDB as a real operating-system service and drives its whole life cycle.
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-15, windows-2025] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable }
      - run: cargo build --locked --release
      - name: Service life cycle (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          # a service runs the installed binary, not one under a home directory
          sudo install -m 755 target/release/powerdb /usr/local/bin/powerdb
          sudo powerdb service install --addr 127.0.0.1:8140
          for i in $(seq 1 30); do powerdb status --addr 127.0.0.1:8140 && break; sleep 2; done
          powerdb status --addr 127.0.0.1:8140
          sudo powerdb service status
          sudo powerdb service stop
          sleep 3
          ! powerdb status --addr 127.0.0.1:8140
          sudo powerdb service start
          for i in $(seq 1 30); do powerdb status --addr 127.0.0.1:8140 && break; sleep 2; done
          powerdb status --addr 127.0.0.1:8140
          sudo powerdb service uninstall
          sleep 2
          ! powerdb status --addr 127.0.0.1:8140
      - name: Service life cycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$PWD\target\release\powerdb.exe"
          & $exe service install --data "$env:RUNNER_TEMP\pdb-service" --addr 127.0.0.1:8140
          if ($LASTEXITCODE -ne 0) { exit 1 }
          for ($i = 0; $i -lt 30; $i++) { & $exe status --addr 127.0.0.1:8140; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 2 }
          & $exe status --addr 127.0.0.1:8140
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\pdb-service\powerdb.log" -ErrorAction SilentlyContinue; sc.exe query PowerDB; exit 1 }
          & $exe service status
          & $exe service stop
          Start-Sleep 4
          & $exe status --addr 127.0.0.1:8140
          if ($LASTEXITCODE -eq 0) { Write-Error "still running after stop"; exit 1 }
          & $exe service start
          for ($i = 0; $i -lt 30; $i++) { & $exe status --addr 127.0.0.1:8140; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 2 }
          & $exe status --addr 127.0.0.1:8140
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe service uninstall
  install-scripts:
    # Runs the real installers against the latest published release, on every platform they claim to support.
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: install.sh
        if: runner.os != 'Windows'
        env: { POWERDB_REPO: "${{ github.repository }}", POWERDB_BIN_DIR: "${{ runner.temp }}/bin" }
        run: |
          ./scripts/install.sh
          "$POWERDB_BIN_DIR/powerdb" --version
          "$POWERDB_BIN_DIR/powerdb" init "$RUNNER_TEMP/data" | head -3
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Repo "${{ github.repository }}" -Dest "$env:RUNNER_TEMP\powerdb"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\powerdb\powerdb.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
  desktop:
    # The desktop app (PowerDB Manager): lifecycle tests against the real server, then build the installer, install it the
    # way a user would, start it, and check the bundled server comes up and goes away again.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, bundle: dmg }
          - { os: windows-2025, bundle: nsis }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: cargo build --locked --release
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run sidecar
        working-directory: desktop
      - name: Manager lifecycle tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          export POWERDB_BIN="$GITHUB_WORKSPACE/target/release/powerdb$([ "$RUNNER_OS" = Windows ] && echo .exe)"
          cargo test --release --locked
      - name: Build the installer
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Install, start, stop (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          hdiutil attach desktop/src-tauri/target/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          mkdir -p "$RUNNER_TEMP/apps" && cp -R "$RUNNER_TEMP/dmg/PowerDB.app" "$RUNNER_TEMP/apps/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          DATA="$RUNNER_TEMP/data"; ./target/release/powerdb init "$DATA" >/dev/null
          CFG="$HOME/Library/Application Support/dev.powerdb.desktop"; mkdir -p "$CFG"
          printf '{"configured":true,"data_dir":"%s","port":8150,"auto_start_server":true}' "$DATA" > "$CFG/config.json"
          open -n "$RUNNER_TEMP/apps/PowerDB.app" --args --hidden
          for i in $(seq 1 30); do ./target/release/powerdb status --addr 127.0.0.1:8150 && break; sleep 2; done
          ./target/release/powerdb status --addr 127.0.0.1:8150
          osascript -e 'tell application id "dev.powerdb.desktop" to quit'
          sleep 5
          ! ./target/release/powerdb status --addr 127.0.0.1:8150
          ./target/release/powerdb check --data "$DATA" --quick
      - name: Install, start, stop, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'PowerDB'
          Get-ChildItem $dir | Format-Table Name, Length
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|^powerdb\.exe$' } | Select-Object -First 1
          $server = Join-Path $dir 'powerdb.exe'
          if (-not (Test-Path $server)) { throw 'the installer did not install the bundled server' }
          $data = Join-Path $env:RUNNER_TEMP 'data'
          & $server init $data | Out-Null
          $cfg = Join-Path $env:APPDATA 'dev.powerdb.desktop'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          @{ configured = $true; data_dir = $data; port = 8150; auto_start_server = $true } | ConvertTo-Json | Set-Content (Join-Path $cfg 'config.json')
          $p = Start-Process -FilePath $app.FullName -ArgumentList '--hidden' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { & $server status --addr 127.0.0.1:8150 2>$null; if ($LASTEXITCODE -eq 0) { $ok = $true; break }; Start-Sleep 2 }
          if (-not $ok) { throw 'the app did not bring its server up' }
          # a crashed manager must take its server with it (it closes the server's standard input)
          Stop-Process -Id $p.Id -Force
          Start-Sleep 6
          & $server status --addr 127.0.0.1:8150 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'the server outlived the app' }
          & $server check --data $data --quick
          if ($LASTEXITCODE -ne 0) { throw 'the data folder was left locked or damaged' }
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          Start-Sleep 3
          if (Test-Path $server) { throw 'uninstall left the server behind' }
