name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15,         target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: windows-2025,     target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable }
      - run: cargo build --locked --release
      - name: Smoke test the built binary
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          ./target/release/powerdb$ext --version
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/powerdb.exe out/
            (cd out && 7z a ../powerdb-${{ matrix.target }}.zip powerdb.exe)
          else
            cp target/release/powerdb out/
            tar -czf powerdb-${{ matrix.target }}.tar.gz -C out powerdb
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg-${{ matrix.target }}
          path: |
            powerdb-*.tar.gz
            powerdb-*.zip
  # The desktop app: a .dmg for macOS (Apple silicon and Intel) and an .exe installer for Windows.
  desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, bundle: dmg }
          - { os: macos-15-intel, bundle: dmg }
          - { os: windows-2025, bundle: nsis }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: stable }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: cargo build --locked --release
      - run: npm ci
        working-directory: desktop
      - run: npm run sidecar
        working-directory: desktop
      - name: Set up the macOS signing identity
        if: runner.os == 'macOS'
        env:
          POWERDB_SIGNING_P12: ${{ secrets.POWERDB_SIGNING_P12 }}
          POWERDB_SIGNING_P12_PASSWORD: ${{ secrets.POWERDB_SIGNING_P12_PASSWORD }}
        run: scripts/macos-signing.sh
      - run: npx tauri build --bundles ${{ matrix.bundle }}
        working-directory: desktop
      - name: Check the app's signing identity (macOS)
        if: runner.os == 'macOS'
        run: |
          mnt="$RUNNER_TEMP/sigcheck"
          hdiutil attach desktop/src-tauri/target/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          app="$mnt/PowerDB.app"
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" 2>&1 | grep designated
          ok=1
          if [ -n "${{ secrets.POWERDB_SIGNING_P12 }}" ]; then
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate root = H"' || ok=0
          fi
          hdiutil detach "$mnt" >/dev/null
          [ "$ok" = 1 ] || { echo "expected a certificate-based identity"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: "{pkg,desktop}-*", merge-multiple: true }
      - name: Gather the installers
        # the installer artifacts keep their bundle folder names (dmg/, nsis/); the release wants plain files
        run: |
          find dmg nsis -type f \( -name '*.dmg' -o -name '*-setup.exe' \) -exec mv {} . \;
          rmdir dmg nsis 2>/dev/null || true
          ls -la
          test "$(ls PowerDB_* | wc -l)" -ge 3 || { echo "expected two .dmg files and one setup .exe"; exit 1; }
      - name: Checksums
        run: sha256sum powerdb-* PowerDB_* > SHA256SUMS
      # A signed statement, from GitHub, that these exact files were built by this workflow from this commit.
      # Verify one with: gh attestation verify <file> --repo <owner>/powerdb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            powerdb-*
            PowerDB_*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" powerdb-* PowerDB_* SHA256SUMS --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
  # One image per architecture, each built natively on its own runner (an emulated Rust build would take far longer),
  # pushed by digest, then merged into a single multi-arch tag.
  docker:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, slug: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, slug: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Image name (registries require lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: /tmp/digests, pattern: "digest-*", merge-multiple: true }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show the result
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.ref_name }}"
