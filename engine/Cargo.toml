[package]
name = "powerdb"
description = "One database for structured records and files: LSM metadata index, content-addressed chunked blob log, row-level security, one binary."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "powerdb"
path = "src/lib.rs"

[[bin]]
name = "powerdb"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
fastcdc = "5.0.0"
fjall = "3.1.13"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
