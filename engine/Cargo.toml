[package]
name = "powerdb"
description = "One database for structured records and files: LSM metadata index, content-addressed chunked blob log, row-level security, one binary."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "powerdb"
path = "src/lib.rs"

[[bin]]
name = "powerdb"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
fastcdc = "5.0.0"
fjall = "3.1.13"
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
