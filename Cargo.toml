[workspace]
members = ["engine"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.4.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# not "abort": a bug that panics while serving one request must not take the whole server (and every other client) down;
# the panic is caught per request (see api::router) and answered with a 500
panic = "unwind"
